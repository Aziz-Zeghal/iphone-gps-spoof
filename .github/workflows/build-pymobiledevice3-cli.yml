name: Build pymobiledevice3 CLI (test)

# Temporary: packages the upstream pymobiledevice3 command-line tool for Windows,
# to check that the current library can simulate a location on an iOS 26 iPhone
# before porting src/main.py to it.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pymobiledevice3 and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pymobiledevice3==11.23.0 pyinstaller==6.22.3

      # Same PyInstaller fixes as the app build: pytun_pmd3's wintun.dll (loaded at import),
      # zeroconf's Cython modules and pyimg4's metadata
      - name: Build exe
        shell: pwsh
        run: |
          Set-Content -Path pmd3_cli.py -Value "from pymobiledevice3.__main__ import main`n`nmain()"
          pyinstaller --onedir --name pymobiledevice3 --collect-all pymobiledevice3 --collect-all pytun_pmd3 `
            --collect-submodules zeroconf --copy-metadata pyimg4 pmd3_cli.py

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "dist\pymobiledevice3\pymobiledevice3.exe"
          $commands = '--help', 'usbmux list', 'mounter auto-mount --help',
                      'developer dvt simulate-location set --help', 'amfi developer-mode-status --help', '--no-color doctor'
          $failed = $false
          foreach ($cmd in $commands) {
            $out = & $exe $cmd.Split(' ') 2>&1 | Out-String
            if ($out -match 'Traceback|ModuleNotFoundError|PackageNotFoundError|ImportError') {
              Write-Host "FAIL: $cmd"; Write-Host $out; $failed = $true
            } else {
              Write-Host "ok:   $cmd"
            }
          }
          & $exe --no-color doctor
          if ($failed) { exit 1 }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: pymobiledevice3-cli-windows
          path: dist/pymobiledevice3/
